# ==========================================================================
# STITCH — CI/CD
#   CI  (todo push e pull request):  instala -> checa -> migrações -> TESTES -> build
#   CD  (só push na branch main):    se tudo passou, publica (deploy)
# ==========================================================================
name: CI/CD Stitch

on:
  push:
    branches: [main, matheus-costa]
  pull_request:
    branches: [main]
  workflow_dispatch:          # botão "Run workflow" na aba Actions

# cancela execuções antigas da mesma branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  DJANGO_DEBUG: "False"

jobs:
  # ------------------------------------------------------------------------
  # 1) TESTES + BUILD
  # ------------------------------------------------------------------------
  test-and-build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Localizar o projeto Django (manage.py)
        id: proj
        run: |
          MANAGE=$(find . -name manage.py -not -path "*/node_modules/*" -not -path "*/.venv/*" | head -n 1)
          if [ -z "$MANAGE" ]; then
            echo "::error::manage.py não encontrado no repositório"; exit 1
          fi
          DIR=$(dirname "$MANAGE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Django em: $DIR"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          REQ=$(find . -name requirements.txt -not -path "*/node_modules/*" -not -path "*/.venv/*" | head -n 1)
          if [ -n "$REQ" ]; then pip install -r "$REQ"; else pip install django; fi

      - name: Checagem do Django (check)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: python manage.py check

      - name: Migrações em dia? (makemigrations --check)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes automatizados
        working-directory: ${{ steps.proj.outputs.dir }}
        run: python manage.py test --verbosity 2 --failfast

      - name: Build dos arquivos estáticos (collectstatic)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: python manage.py collectstatic --noinput

      - name: Guardar o build como artefato
        uses: actions/upload-artifact@v4
        with:
          name: stitch-build
          path: |
            ${{ steps.proj.outputs.dir }}
            !${{ steps.proj.outputs.dir }}/**/__pycache__
            !${{ steps.proj.outputs.dir }}/**/*.sqlite3
          retention-days: 7

  # ------------------------------------------------------------------------
  # 2) DEPLOY (só na main e só se os testes passaram)
  # ------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Disparar o deploy (Render)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado: deploy ignorado."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK_URL"
          echo "Deploy solicitado."
