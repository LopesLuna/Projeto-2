<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Stitch — Projeto 2, Grupo 13{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 0 20px 40px; color: #222; }
        nav { display: flex; gap: 20px; padding: 16px 0; border-bottom: 2px solid #eee; margin-bottom: 24px; }
        nav a { text-decoration: none; color: #2e6fd9; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        h1 { color: #222; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background-color: #f0f0f0; }
        .status-pendente { color: #b8860b; }
        .status-em_andamento { color: #1e6fd9; }
        .status-concluida { color: #2e8b57; }
        .btn { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #2e6fd9; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'equipe' %}">Equipe</a>
        <a href="{% url 'fale_conosco' %}">Fale Conosco</a>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
