<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stitch — Projeto 2, Grupo 13{% endblock %}</title>
    <style>
        :root {
            --verde: #3E7C4F;
            --verde-claro: #E8F2EA;
            --cinza-bloco: #F4F4F4;
            --borda: #DDD;
            --tinta: #222;
        }
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; color: var(--tinta); background: #fff; }
        header { max-width: 1000px; margin: 0 auto; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: bold; color: var(--verde); text-decoration: none; }
        nav.menu { display: flex; gap: 24px; flex-wrap: wrap; }
        nav.menu a { text-decoration: none; color: var(--tinta); font-weight: bold; font-size: 14px; }
        nav.menu a:hover { color: var(--verde); text-decoration: underline; }
        main { max-width: 1000px; margin: 0 auto; padding: 0 20px 60px; }
        h1 { font-size: 28px; }
        h2 { margin-top: 40px; }
        .bloco { background: var(--cinza-bloco); border-radius: 10px; padding: 24px; margin-top: 16px; }
        .placeholder { border: 2px dashed var(--borda); border-radius: 10px; padding: 24px; margin-top: 16px; color: #888; text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
        .grid-equipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
        .card-equipe { background: var(--cinza-bloco); border-radius: 10px; padding: 20px; text-align: center; }
        .btn { display: inline-block; margin-top: 16px; padding: 10px 20px; background: var(--verde); color: #fff; text-decoration: none; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        footer { border-top: 1px solid var(--borda); margin-top: 60px; padding: 24px 20px; text-align: center; color: #666; font-size: 13px; }
        footer a { color: var(--verde); text-decoration: none; margin: 0 8px; }
        @media (max-width: 700px) { .grid-2, .grid-equipe { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="{% url 'home' %}">🧵 Stitch</a>
        <nav class="menu">
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'entenda_esg' %}">Entenda ESG</a>
            <a href="{% url 'simulacoes' %}">Simulações</a>
            <a href="{% url 'equipe' %}">Quem Somos?</a>
            <a href="{% url 'fale_conosco' %}">Entre em Contato</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>🧵 Stitch — Projeto 2, Grupo 13 · CESAR School</p>
        <p>
            <a href="{% url 'home' %}">Início</a> ·
            <a href="{% url 'entenda_esg' %}">Entenda ESG</a> ·
            <a href="{% url 'simulacoes' %}">Simulações</a> ·
            <a href="{% url 'equipe' %}">Quem Somos?</a> ·
            <a href="{% url 'fale_conosco' %}">Entre em Contato</a>
        </p>
    </footer>
</body>
</html>
