<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch - Sustentabilidade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #f8f9fa; color: #1e392a; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }
        .logo { font-size: 24px; font-weight: bold; color: #1e392a; text-decoration: none; }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a5d4e;
            font-size: 15px;
        }
        nav a:hover, nav a.active {
            text-decoration: underline;
            color: #1e392a;
        }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .card {
            background-color: #ffffff;
            border: 2px solid #dcdcdc;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card-verde { background-color: #e3ebe4; border: none; }
    </style>
</head>
<body>

    <!-- Header Fixo do Wireframe -->
    <header>
        <a href="{% url 'home' %}" class="logo">🌿 Stitch</a>
        <nav>
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'simulacao' %}">Simulação</a>
            <a href="{% url 'quem_somos' %}">Quem Somos</a>
            <a href="{% url 'contato' %}">Entre em Contato</a>
        </nav>
    </header>

    <!-- Onde o conteúdo de cada página vai entrar -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
