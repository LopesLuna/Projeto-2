{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch - Sustentabilidade</title>

    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/trama.css' %}">
    {% endblock %}

</head>
<body>

    <!-- Header Fixo do Wireframe -->
    <header>
        <a href="{% url 'home' %}" class="logo">🌿 Stitch</a>
        <nav>
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'simulacao' %}">Simulação</a>
            <a href="{% url 'quem_somos' %}">Quem Somos</a>
            <a href="{% url 'contato' %}">Entre em Contato</a>
        </nav>
    </header>

    <!-- Onde o conteúdo de cada página vai entrar -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
