{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch - Sustentabilidade</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/trama.css' %}">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block extra_css %}
    {% endblock %}
</head>
<body>
    <div class="container">
        <header id="global-header">
            <a href="{% url 'home' %}" class="logo-link">
                <span class="logo-text">Stitch</span>
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="{% url 'home' %}" class="nav-link active">Início</a></li>
                    <li><a href="{% url 'entenda_esg' %}" class="nav-link">Entenda ESG</a></li>
                    <li><a href="{% url 'simuladores' %}" class="nav-link">Simulações</a></li>
                    <li><a href="{% url 'quem_somos' %}" class="nav-link">Quem Somos?</a></li>
                    <li><a href="{% url 'contato' %}" class="nav-link">Entre em Contato</a></li>
                </ul>
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>
</html>
