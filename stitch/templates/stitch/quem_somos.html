<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Quem Somos - STITCH</title>
    
    <!-- AQUI ENTRA O CSS (A MAQUILHAGEM) -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f2e6;
        }

        .cabecalho {
            background-color: #8c865c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .circulo-logo {
            width: 35px;
            height: 35px;
            background-color: #dfd8c4;
            border-radius: 50%;
            margin-right: 10px;
        }

        .texto-logo {
            font-size: 24px;
            color: #000000;
        }

        .navegacao {
            display: flex;
            gap: 15px;
        }

        .botao-nav {
            background-color: #355320;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<!-- AQUI ENTRA O HTML (O ESQUELETO VISÍVEL) -->
<body>

    <header class="cabecalho">
        <div class="logo">
            <div class="circulo-logo"></div>
            <span class="texto-logo">STITCH</span>
        </div>

        <nav class="navegacao">
            <a href="/" class="botao-nav">Ínicio</a>
            <a href="/entenda-esg/" class="botao-nav">Entenda ESG</a>
            <a href="/simuladores/" class="botao-nav">Simulações</a>
            <a href="/quem-somos/" class="botao-nav">Quem Somos?</a>
            <a href="/contato/" class="botao-nav">Entre em Contato</a>
        </nav>
    </header>

</body>
</html>
